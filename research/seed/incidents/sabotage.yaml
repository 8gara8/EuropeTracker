- date: 2025-11-16
  where: PL
  location: Mika and Puławy, Warsaw–Lublin railway
  type: rail_sabotage
  rung: 2
  serious: true
  attribution: 4
  note: Prosecutors charged two Ukrainians working for Russian intelligence, who fled to Belarus.
  summary: A military-grade explosive tore up the Warsaw–Lublin line used for aid to Ukraine near Mika as a freight train passed; near Puławy a bracket was jammed on the track and wires downed before a train with 473 passengers. Tusk called it unprecedented sabotage.
  src:
    - [intl_press, "AP", "Polish PM says rail line explosion was sabotage", "https://apnews.com/article/poland-sabotage-explosion-rail-track-warsaw-97dae3045d4e1ff329780526c6279c0f", "2025-11-17"]
