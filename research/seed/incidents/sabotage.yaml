- date: 2024-03-20
  where: GB
  location: Leyton, east London
  type: arson
  rung: 2
  attribution: 4
  note: Men recruited by the Wagner Group were convicted in 2024 and 2025.
  summary: Arsonists set fire to a warehouse of Ukrainian-owned businesses shipping aid to Ukraine. The organiser admitted acting for the Wagner Group, and three more men were convicted in July 2025.
  src:
    - [intl_press, "The Guardian", "Men acting for Wagner Group convicted of arson on Ukraine-linked London warehouse", "https://www.theguardian.com/uk-news/2025/jul/08/three-men-found-guilty-over-london-arson-attack-on-ukraine-linked-firms", "2025-07-08"]
