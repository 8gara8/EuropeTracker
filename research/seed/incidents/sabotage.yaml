- date: 2024-05-09
  where: LT
  location: IKEA store, Vilnius
  type: arson
  rung: 2
  attribution: 4
  note: Lithuanian prosecutors said Russian military intelligence ordered the attack and charged two Ukrainians.
  summary: An incendiary device set fire to the IKEA store in Vilnius after hours. No one was hurt. Prosecutors called it terrorism organised by Russia's GRU.
  src:
