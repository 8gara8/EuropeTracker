# Seed incidents: sabotage and covert action (SPEC §9 Phase 4; counting rules in routine/STYLE.md §4).
# Logged only when officials link the act at least as "suspected" to Russia or its proxies. Coverage of
# rung 2 is representative, not complete: dozens of smaller arsons and arrests are left out.
# src: [category, outlet, title, url, published]. Ids are assigned by seed:build.

# ---------------------------------------------------------------- 2022
- date: 2022-04-25
  where: MD
  location: Tiraspol, Transnistria
  type: explosive
  rung: 2
  attribution: 2
  note: Kyiv called it a Russian provocation; the Institute for the Study of War judged it a likely Kremlin false-flag operation.
  summary: Grenade-launcher fire hit the headquarters of the Transnistrian state security ministry in Tiraspol, the first of a series of blasts in the Russian-backed region. No one was hurt.
  src:
    - [intl_press, "Reuters", "Ukraine warns against attempts to drag Moldova's Transniestria region into war", "https://www.reuters.com/world/europe/ukraine-warns-against-attempts-drag-moldovas-transniestria-region-into-war-2022-04-26/", "2022-04-26"]

- date: 2022-04-26
  where: MD
  location: Maiac, Grigoriopol, Transnistria
  type: infrastructure_sabotage
  rung: 2
  attribution: 2
  note: Kyiv blamed Russia; Moldova's president said factions in the region wanted to raise tension.
  summary: Two explosions knocked out two radio masts broadcasting Russian stations at the Grigoriopol transmitter in Maiac, a day after the Tiraspol attack.
  src:
    - [intl_press, "Reuters", "Tensions surge after breakaway Moldovan region reports attacks; Kyiv blames Russia", "https://www.reuters.com/world/europe/blasts-hit-soviet-era-radio-antennae-breakaway-moldovan-region-authorities-say-2022-04-26/", "2022-04-26"]

- date: 2022-10-08
  where: DE
  location: Northern Germany (cuts near Berlin and in Herne)
  type: rail_sabotage
  rung: 2
  serious: true
  attribution: 2
  note: The interior minister called it deliberate; politicians raised suspicion of Russia, but no one was charged.
  hours: 3
  summary: Saboteurs cut Deutsche Bahn's GSM-R radio cables at two sites, stopping long-distance and freight trains across northern Germany and to Denmark and the Netherlands for about three hours.
  src:
    - [eu_regional_press, "The Local Germany", "Germany probes rail 'sabotage' amid Russia tensions", "https://www.thelocal.de/20221009/germany-probes-rail-sabotage-amid-russia-tensions", "2022-10-09"]

# ---------------------------------------------------------------- 2023
- date: 2023-03-15
  where: PL
  location: Eastern Poland
  type: sabotage_arrest
  rung: 2
  attribution: 4
  note: Polish courts convicted 14 members in December 2023.
  summary: Poland arrested members of a Russian spy network that planted cameras along rail lines carrying weapons to Ukraine and planned to derail supply trains. Fourteen were later convicted.
  src:
