- date: 2024-05-12
  where: PL
  location: Marywilska 44 shopping centre, Warsaw
  type: arson
  rung: 2
  attribution: 4
  note: Poland said the arson was ordered by Russian intelligence, charged suspects and closed Russia's consulate in Kraków.
  summary: A night fire destroyed Warsaw's Marywilska 44 shopping centre, with about 1,400 stalls. No one was hurt. Poland later said it was arson ordered by Russian military intelligence.
  src:
    - [intl_press, "CNN", "Poland blames Russian intelligence for arson attack on Warsaw shopping center last year", "https://www.cnn.com/2025/05/11/europe/poland-blames-russian-intelligence-fire-shopping-center-latam-intl", "2025-05-11"]
    - [eu_regional_press, "Notes from Poland", "Poland confirms Russia behind fire that destroyed Warsaw’s biggest shopping centre", "https://notesfrompoland.com/2025/05/12/poland-confirms-russia-behind-fire-that-destroyed-warsaws-biggest-shopping-centre", "2025-05-12"]

- date: 2024-06-07
  where: CZ
  location: Klíčov bus depot, Prague
  type: arson
  rung: 2
  attribution: 4
  note: The Czech prime minister said it was probably organised and financed from Russia; the arsonist was convicted in 2025.
  summary: A Colombian man recruited over Telegram tried to set fire to public buses at a Prague depot; workers put out the fires. He was sentenced to eight years.
  src:
    - [intl_press, "Euronews", "Czech court sentences Colombian to eight years in prison for Russia-linked arson attack", "https://www.euronews.com/2025/06/09/czech-court-sentences-colombian-to-eight-years-in-prison-for-russia-linked-arson-attack", "2025-06-09"]

- date: 2024-07-20
  where: DE
  affected: [DE, GB, PL, LT]
  location: DHL hub, Leipzig/Halle Airport
  type: explosive
  rung: 2
  attribution: 3
  note: Polish prosecutors and German security services linked the parcels to Russian intelligence; Lithuania charged 15 people in 2025.
  summary: An incendiary parcel posted in Vilnius ignited at the DHL hub in Leipzig before loading onto a cargo plane; another burned at a DHL warehouse near Birmingham two days later. Officials called them a test run for attacks on flights to North America.
  src:
