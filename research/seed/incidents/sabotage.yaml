- date: 2024-04-17
  where: DE
  location: Bayreuth, Bavaria
  type: sabotage_arrest
  rung: 2
  attribution: 4
  note: A Munich court convicted the main defendant in October 2025.
  summary: German police arrested two German-Russian men accused of scouting US military sites and rail lines for bombing and arson attacks on behalf of Russia to undermine aid to Ukraine.
