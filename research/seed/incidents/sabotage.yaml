# ---------------------------------------------------------------- 2026
- date: 2026-08-04
  where: DE
  location: Leipzig/Halle Airport
  type: explosive
  rung: 3
  serious: true
  attribution: 3
  note: Germany formally blamed Russia on 1 September 2026 and closed the Russian consulate in Bonn; investigators linked GRU Unit 29155.
  hours: 2
  summary: An explosive-laden drone flown over the cellular network hit the wing of a Ukrainian An-124 at Leipzig airport but did not detonate. The airport closed, and a cargo jet going around struck a second drone and declared a mayday.
  src:
    - [intl_press, "The Guardian", "Drone carrying explosives at German airport marks ‘new level of danger’, says interior minister", "https://www.theguardian.com/world/2026/aug/05/drone-german-airport-dhl-cargo-plane-collides-object-leipzig", "2026-08-05"]
