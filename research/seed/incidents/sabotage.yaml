- date: 2023-12-01
  month: true
  where: EE
  location: Tallinn
  type: proxy_recruitment
  rung: 2
  attribution: 3
  note: Estonia's Internal Security Service said Russian special services ordered the attacks.
  summary: Locally recruited proxies smashed the windows of cars belonging to Estonia's interior minister and a journalist. Estonia's security service later detained suspects acting on Russian orders.
  src:
