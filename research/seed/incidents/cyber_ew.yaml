- date: 2026-08-24
  where: "NO"
  location: Norway (national digital services)
  type: ddos
  rung: 1
  attribution: 2
  note: The pro-Russian group Server Killers claimed it; Norway did not confirm the perpetrators.
  summary: A denial-of-service attack on Norway's Digitalisation Directorate disrupted about ten national services, including the ID-porten login and the Altinn portal, for several days, the biggest such attack it had seen.
  src:
    - [eu_regional_press, "The Barents Observer", "Pro-Russian hackers declare ‘cyberwar’ on Norway", "https://www.thebarentsobserver.com/news/prorussian-hackers-declare-cyberwar-on-norway/456591", "2026-08-26"]
