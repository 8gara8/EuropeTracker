    - [intl_press, "Reuters", "Finland boards oil tanker suspected of causing internet, power cable outages", "https://www.reuters.com/world/europe/finland-police-investigate-role-foreign-ship-after-power-cable-outage-2024-12-26/", "2024-12-26"]
