- date: 2024-11-17
  where: SE
  affected: [SE, LT, FI, DE]
  location: Off Öland and Gotland
  sea: baltic
  type: cable_damage
  rung: 2
  serious: true
  attribution: 2
  note: Germany's defence minister assumed sabotage; the Chinese bulk carrier Yi Peng 3 was investigated. No party has been formally blamed.
