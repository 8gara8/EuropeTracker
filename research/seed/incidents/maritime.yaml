- date: 2024-12-25
  where: FI
  affected: [FI, EE]
  location: Gulf of Finland
  sea: baltic
  type: cable_damage
  rung: 2
  serious: true
  attribution: 2
  note: Finland suspected the shadow-fleet tanker Eagle S of dragging its anchor; a Helsinki court ruled in October 2025 it lacked jurisdiction.
  summary: The Estlink 2 power cable between Finland and Estonia failed, cutting cross-border capacity from 1,016 to 358 MW for months, and four telecom cables were damaged. Finnish special forces boarded and detained the tanker Eagle S, which had left Ust-Luga.
