# Seed incidents: maritime (SPEC §9 Phase 4; counting rules in routine/STYLE.md §4).
# Conventions: cable or pipeline damage is rung 2 (rung 3 with a naval stand-off); a European boarding or
# seizure of a shadow-fleet ship is rung 2, a Russian escort or monitoring incident rung 1; a mine destroyed
# offshore is rung 1, a mine in territorial waters or one that damages a ship rung 3; any death means rung 4.
# src: [category, outlet, title, url, published]. Ids are assigned by seed:build.

# ---------------------------------------------------------------- 2022
- date: 2022-03-28
  where: RO
