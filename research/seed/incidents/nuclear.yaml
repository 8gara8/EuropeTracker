- date: 2026-08-20
  where: UA
  affected: [MD, RO]
  location: Zaporizhzhia nuclear power plant
  type: plant_safety_event
  rung: 1
  attribution: 2
  summary: Military activity cut Zaporizhzhia's only remaining off-site line, its 26th loss of off-site power in the war. Power was restored in early September after an IAEA-brokered local ceasefire allowed repairs.
  src:
    - [intl_press, "American Nuclear Society", "Zaporizhzhia restores off-site power following IAEA-brokered local ceasefire", "https://www.ans.org/news/2026-09-09/article-8377/zaporizhzhia-restores-offsite-power-following-iaeabrokered-local-ceasefire/", "2026-09-09"]
